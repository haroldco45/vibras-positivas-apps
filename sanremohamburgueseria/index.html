<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>San Remo Hamburguesería</title>
    <style>
        :root { --naranja: #ff6d00; --negro: #0a0a0a; --gris: #1e1e1e; --blanco: #ffffff; --verde: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--negro); color: var(--blanco); padding-bottom: 230px; }
        
        /* ENCABEZADO MEJORADO */
        header { 
            background: #000; 
            padding: 20px 10px; 
            text-align: center; 
            border-bottom: 3px solid var(--naranja); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .logo { width: 75px; border-radius: 50%; border: 2px solid var(--naranja); margin-bottom: 10px; }
        .brand-name { font-size: 19px; font-weight: bold; letter-spacing: 1px; color: var(--blanco); }
        .brand-sub { font-size: 11px; color: var(--naranja); font-weight: bold; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
        .info-header { font-size: 10px; color: #888; margin-top: 8px; line-height: 1.4; }
        
        .container { padding: 12px; max-width: 500px; margin: auto; }
        .card { background: var(--gris); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: var(--naranja); text-transform: uppercase; font-size: 13px; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; }
        .input-form { width: 100%; padding: 10px; margin: 5px 0 10px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; box-sizing: border-box; font-size: 14px; }
        
        .item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #333; align-items: flex-start; }
        .item-img { width: 85px; height: 85px; border-radius: 10px; object-fit: cover; background: #333; flex-shrink: 0; border: 1px solid #444; }
        .item-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 85px; }
        .item-nombre { font-weight: bold; font-size: 13px; color: var(--naranja); text-transform: uppercase; }
        .item-desc { font-size: 10px; color: #bbb; line-height: 1.2; margin: 3px 0; }
        .item-precio { font-weight: bold; font-size: 15px; color: var(--blanco); }
        
        .controles { display: flex; align-items: center; gap: 10px; background: #000; padding: 5px 10px; border-radius: 50px; border: 1px solid #444; }
        .btn-c { background: var(--naranja); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; }
        
        .total-sticky { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 3px solid var(--naranja); padding: 15px; box-sizing: border-box; z-index: 1001; }
        .btn-enviar { background: var(--verde); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        .copy { text-align: center; font-size: 8px; color: #666; margin-top: 8px; }
    </style>
</head>
<body>

<header>
    <img src="sanremo.PNG" class="logo" alt="San Remo">
    <div class="brand-name">SAN REMO HAMBURGUESERÍA</div>
    <div class="brand-sub">COCINA OCULTA | 📍 CAUCASIA</div>
    <div class="info-header">
        📱 WhatsApp: +57 321 7072960<br>
        🕒 Miércoles a Domingo y Lunes Festivos<br>
        (5:30 PM - 10:00 PM)
    </div>
</header>

<div class="container">
    <div class="card">
        <h3>👤 TUS DATOS</h3>
        <input type="text" id="nombre" class="input-form" placeholder="Tu Nombre" oninput="guardar()">
        <input type="tel" id="cel" class="input-form" placeholder="WhatsApp" oninput="guardar()">
        <input type="text" id="dir" class="input-form" placeholder="Dirección y Barrio" oninput="guardar()">
        <select id="pago" class="input-form">
            <option value="Efectivo">Efectivo</option>
            <option value="Nequi">Nequi</option>
            <option value="Bancolombia">Bancolombia / A la mano</option>
        </select>
        <textarea id="obs" class="input-form" style="height: 45px;" placeholder="¿Alguna nota adicional?"></textarea>
    </div>

    <div class="card">
        <h3>🍔 MENÚ SMASH</h3>
        <div id="lista-menu"></div>
    </div>
</div>

<div class="total-sticky">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span style="font-weight: bold;">TOTAL PEDIDO:</span>
        <span style="color: var(--naranja); font-size: 24px; font-weight: bold;">$<span id="total-val">0</span></span>
    </div>
    <button class="btn-enviar" onclick="enviar()">🚀 CONFIRMAR POR WHATSAPP</button>
    <div class="copy">DESARROLLADO POR VIBRAS POSITIVAS © 2026</div>
</div>

<script>
    const productos = [
        { id: 1, n: "DULCE PECADO", p: 28000, d: "Nuestra smash insignia con el toque dulce perfecto.", img: "dulcepecado.JPG" },
        { id: 2, n: "AMERICAN SMASH", p: 22000, d: "Clásico sabor americano con doble carne y cheddar.", img: "americansmashburger.JPG" },
        { id: 3, n: "LA CREMOSA CHERRY", p: 25000, d: "Queso crema y reducción artesanal de cerezas.", img: "lacremosacherrysmashburger.JPG" },
        { id: 4, n: "LA TOCIMELADA", p: 25000, d: "Tocineta bañada en miel sobre carnes smash.", img: "latocimeladasmashburger.JPG" },
        { id: 5, n: "PAPAS A LA FRANCESA", p: 5000, d: "Porción de papas crujientes con sal marina.", img: "papasalafrancesa.JPG" },
        { id: 6, n: "COCA COLA ORIGINAL", p: 4000, d: "400ml - Sabor Original.", img: "cocacolaoriginal400.JPG" },
        { id: 7, n: "COCA COLA ZERO", p: 4000, d: "400ml - Sin Azúcar.", img: "cocacolazero400.JPG" }
    ];

    let carrito = {};

    function render() {
        const v = new Date().getTime();
        document.getElementById('lista-menu').innerHTML = productos.map(p => `
            <div class="item">
                <img src="${p.img}?v=${v}" class="item-img" onerror="this.src='https://via.placeholder.com/85?text=San+Remo'">
                <div class="item-info">
                    <div class="item-nombre">${p.n}</div>
                    <div class="item-desc">${p.d}</div>
                    <div class="item-precio">$${p.p.toLocaleString()}</div>
                </div>
                <div class="controles">
                    <button class="btn-c" onclick="cambiar(${p.id}, -1)">-</button>
                    <span class="cant" id="cant-${p.id}">0</span>
                    <button class="btn-c" onclick="cambiar(${p.id}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }

    function cambiar(id, delta) {
        carrito[id] = (carrito[id] || 0) + delta;
        if (carrito[id] < 0) carrito[id] = 0;
        document.getElementById(`cant-${id}`).innerText = carrito[id];
        let t = 0;
        productos.forEach(p => { if(carrito[p.id]) t += p.p * carrito[p.id]; });
        document.getElementById('total-val').innerText = t.toLocaleString();
    }

    function guardar() {
        const d = { n: document.getElementById('nombre').value, c: document.getElementById('cel').value, d: document.getElementById('dir').value };
        localStorage.setItem('san_remo_v8', JSON.stringify(d));
    }

    function enviar() {
        const n = document.getElementById('nombre').value;
        const total = document.getElementById('total-val').innerText;
        if (!n || total === "0") return alert("Por favor, ingresa tu nombre y elige tus productos.");

        navigator.geolocation.getCurrentPosition((pos) => {
            const gps = `http://googleusercontent.com/maps.google.com/3{pos.coords.latitude},${pos.coords.longitude}`;
            let msg = `*🍔 SAN REMO - NUEVO PEDIDO*\n👤 *CLIENTE:* ${n}\n📞 *CEL:* ${document.getElementById('cel').value}\n📍 *DIR:* ${document.getElementById('dir').value}\n------------------\n`;
            productos.forEach(p => {
                if (carrito[p.id] > 0) msg += `🔹 ${p.n} (x${carrito[p.id]}) = $${(p.p * carrito[p.id]).toLocaleString()}\n`;
            });
            msg += `------------------\n💰 *TOTAL: $${total}*\n💳 *PAGO:* ${document.getElementById('pago').value}\n📝 *OBS:* ${document.getElementById('obs').value}\n📍 *UBICACIÓN:* ${gps}\n\n_Hecho por VIBRAS POSITIVAS - Derechos de Autor_`;
            window.location.href = `https://wa.me/573217072960?text=${encodeURIComponent(msg)}`;
        }, () => alert("Socio, activa el GPS para poder enviarte el pedido."));
    }

    window.onload = () => {
        render();
        const s = JSON.parse(localStorage.getItem('san_remo_v8'));
        if (s) {
            document.getElementById('nombre').value = s.n || "";
            document.getElementById('cel').value = s.c || "";
            document.getElementById('dir').value = s.d || "";
        }
    };
</script>
</body>
</html>
