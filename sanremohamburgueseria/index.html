<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>San Remo - Hamburguesería Smash</title>
    <style>
        :root { --naranja: #ff6d00; --negro: #0a0a0a; --gris: #1e1e1e; --blanco: #ffffff; --verde: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--negro); color: var(--blanco); padding-bottom: 220px; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 3px solid var(--naranja); position: sticky; top: 0; z-index: 1000; }
        .logo { width: 85px; border-radius: 50%; border: 2px solid var(--naranja); box-shadow: 0 0 15px rgba(255,109,0,0.3); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .info-cocina { background: var(--gris); border-radius: 15px; padding: 12px; margin-bottom: 15px; border-left: 5px solid var(--naranja); font-size: 12px; line-height: 1.4; }
        .card { background: var(--gris); border-radius: 20px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: var(--naranja); text-transform: uppercase; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .input-form { width: 100%; padding: 12px; margin: 5px 0 12px; border-radius: 10px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; font-size: 14px; }
        .seccion-titulo { background: #222; color: var(--naranja); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; margin: 25px 0 10px; text-transform: uppercase; text-align: center; letter-spacing: 1px; }
        .item { display: flex; gap: 12px; padding: 15px 0; border-bottom: 1px solid #333; align-items: center; }
        .item-img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; background: #333; flex-shrink: 0; border: 1px solid #444; }
        .item-info { flex: 1; }
        .item-nombre { font-weight: bold; font-size: 15px; color: var(--blanco); margin-bottom: 3px; }
        .item-desc { font-size: 10px; color: #aaa; margin: 4px 0; line-height: 1.3; }
        .item-precio { font-weight: bold; font-size: 14px; color: var(--naranja); margin-top: 5px; }
        .controles { display: flex; align-items: center; gap: 10px; background: #000; padding: 6px 12px; border-radius: 50px; border: 1px solid #333; }
        .btn-c { background: var(--naranja); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cant { width: 20px; text-align: center; font-weight: bold; font-size: 15px; }
        .total-sticky { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 3px solid var(--naranja); padding: 18px; box-sizing: border-box; z-index: 1001; }
        .btn-enviar { background: var(--verde); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 17px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #128c7e; transition: 0.2s; }
        .btn-enviar:active { transform: translateY(3px); box-shadow: none; }
        .copy { text-align: center; font-size: 9px; color: #555; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" class="logo" alt="San Remo Logo">
    <div style="font-size: 20px; font-weight: bold; margin-top: 8px; letter-spacing: 2px;">SAN REMO</div>
    <div style="font-size: 10px; color: #ffab40; letter-spacing: 1px;">HAMBURGUESERÍA SMASH</div>
</header>

<div class="container">
    <div class="info-cocina">
        🕒 <b>ATENCIÓN:</b> Miércoles a Domingo (5:30 PM - 10:00 PM)<br>
        📍 <b>CAUCASIA:</b> Solo domicilios. Se requiere GPS para la entrega.
    </div>

    <div class="card">
        <h3>👤 MIS DATOS DE ENTREGA</h3>
        <input type="text" id="nombre" class="input-form" placeholder="Nombre completo" oninput="guardarDatos()">
        <input type="tel" id="celular" class="input-form" placeholder="WhatsApp / Celular" oninput="guardarDatos()">
        <input type="text" id="direccion" class="input-form" placeholder="Dirección, Barrio y Referencias" oninput="guardarDatos()">
        
        <div style="display: grid; grid-template-columns: 1fr; gap: 5px;">
            <label style="font-size: 11px; color: var(--naranja); font-weight: bold;">FORMA DE PAGO:</label>
            <select id="pago" class="input-form">
                <option value="Efectivo">Efectivo (Llevar cambio)</option>
                <option value="Nequi">Nequi</option>
                <option value="Bancolombia">Ahorro a la mano</option>
            </select>
        </div>

        <textarea id="obs" class="input-form" style="height: 60px; margin-top: 5px;" placeholder="Observaciones (Ej: Sin cebolla, carne bien asada, traer vueltas de 50...)"></textarea>
    </div>

    <div id="menu-dinamico"></div>
</div>

<div class="total-sticky">
    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold;">
        <span style="font-size: 14px; color: #888;">TOTAL A PAGAR:</span>
        <span style="color: var(--naranja); font-size: 24px;">$<span id="total-val">0</span></span>
    </div>
    <button class="btn-enviar" onclick="enviarPedido()">🚀 CONFIRMAR PEDIDO</button>
    <div class="copy">Desarrollada por VIBRAS POSITIVAS © 2026 - Derechos de Autor</div>
</div>

<script>
    // MENÚ EXTRAÍDO SEGÚN REPOSITORIO DE IMÁGENES
    const menu = {
        "BURGER SMASH": [
            { id: 1, n: "SAN REMO SMASH", p: 14000, d: "Carne Smash 100g, queso cheddar, cebolla picada, pepinillos, mostaza y ketchup original.", img: "img/1.jpg" },
            { id: 2, n: "CHEDDAR & BACON", p: 18000, d: "Carne Smash 100g, doble queso cheddar, tocineta crocante ahumada y salsa especial San Remo.", img: "img/2.jpg" },
            { id: 3, n: "AMERICAN SMASH", p: 20000, d: "Doble carne Smash (200g), doble cheddar fundido, cebolla grillé, pepinillos y salsa de la casa.", img: "img/3.jpg" },
            { id: 4, n: "LA PECADO (DULCE)", p: 22000, d: "Doble carne Smash, queso crema, mermelada de tocineta artesanal y lluvia de cebolla crunchy.", img: "img/4.jpg" }
        ],
        "ADICIONALES": [
            { id: 5, n: "PORCIÓN DE PAPAS", p: 7000, d: "Papas francesas crujientes con el toque San Remo.", img: "img/5.jpg" },
            { id: 6, n: "ADICIÓN DE CARNE", p: 6000, d: "100g de carne de res seleccionada para tu Burger.", img: "img/6.jpg" }
        ],
        "BEBIDAS": [
            { id: 7, n: "COCA COLA 400ml", p: 5000, d: "Refrescante, Sabor Original o Zero.", img: "img/7.jpg" },
            { id: 8, n: "TÉ HATSU", p: 8000, d: "Té premium en botella, varios sabores.", img: "img/8.jpg" }
        ]
    };

    let carrito = {};

    function renderizarMenu() {
        const container = document.getElementById('menu-dinamico');
        let html = '';
        for (const cat in menu) {
            html += `<div class="seccion-titulo">${cat}</div><div class="card">`;
            menu[cat].forEach(p => {
                html += `
                    <div class="item">
                        <img src="${p.img}" class="item-img" onerror="this.src='https://via.placeholder.com/85?text=San+Remo'">
                        <div class="item-info">
                            <div class="item-nombre">${p.n}</div>
                            <div class="item-desc">${p.d}</div>
                            <div class="item-precio">$${p.p.toLocaleString()}</div>
                        </div>
                        <div class="controles">
                            <button class="btn-c" onclick="cambiarCant(${p.id}, -1)">-</button>
                            <span class="cant" id="cant-${p.id}">0</span>
                            <button class="btn-c" onclick="cambiarCant(${p.id}, 1)">+</button>
                        </div>
                    </div>`;
            });
            html += `</div>`;
        }
        container.innerHTML = html;
    }

    function cambiarCant(id, delta) {
        carrito[id] = (carrito[id] || 0) + delta;
        if (carrito[id] < 0) carrito[id] = 0;
        document.getElementById(`cant-${id}`).innerText = carrito[id];
        actualizarTotal();
    }

    function actualizarTotal() {
        let total = 0;
        for (const cat in menu) {
            menu[cat].forEach(p => {
                if (carrito[p.id]) total += p.p * carrito[p.id];
            });
        }
        document.getElementById('total-val').innerText = total.toLocaleString();
    }

    function guardarDatos() {
        const datos = {
            n: document.getElementById('nombre').value,
            c: document.getElementById('celular').value,
            d: document.getElementById('direccion').value
        };
        localStorage.setItem('sanremo_v3_data', JSON.stringify(datos));
    }

    function enviarPedido() {
        const n = document.getElementById('nombre').value.trim();
        const c = document.getElementById('celular').value.trim();
        const d = document.getElementById('direccion').value.trim();
        const p = document.getElementById('pago').value;
        const o = document.getElementById('obs').value.trim();
        const total = document.getElementById('total-val').innerText;

        if (!n || total === "0") return alert("Socio, completa tus datos y el pedido.");

        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const gps = `https://www.google.com/maps?q=${lat},${lon}`;
            
            let msg = `*🍔 SAN REMO - NUEVO PEDIDO*\n`;
            msg += `------------------------------------\n`;
            msg += `👤 *CLIENTE:* ${n}\n`;
            msg += `📞 *CEL:* ${c}\n`;
            msg += `📍 *ENTREGA:* ${d}\n`;
            msg += `------------------------------------\n`;
            
            for (const cat in menu) {
                menu[cat].forEach(item => {
                    if (carrito[item.id] > 0) {
                        msg += `🔹 ${item.n} (x${carrito[item.id]}) = *$${(item.p * carrito[item.id]).toLocaleString()}*\n`;
                    }
                });
            }
            
            msg += `------------------------------------\n`;
            msg += `💰 *TOTAL FINAL: $${total}*\n`;
            msg += `💳 *METODO PAGO:* ${p}\n`;
            if(o) msg += `📝 *NOTA:* ${o}\n`;
            msg += `📍 *LINK GPS:* ${gps}\n\n`;
            msg += `_Enviado desde San Remo App_`;

            window.location.href = `https://wa.me/573217072960?text=${encodeURIComponent(msg)}`;
        }, () => {
            alert("Socio, activa el GPS. Sin ubicación no hay despacho en Cocina Oculta.");
        });
    }

    window.onload = () => {
        renderizarMenu();
        const saved = JSON.parse(localStorage.getItem('sanremo_v3_data'));
        if (saved) {
            document.getElementById('nombre').value = saved.n || "";
            document.getElementById('celular').value = saved.c || "";
            document.getElementById('direccion').value = saved.d || "";
        }
    };
</script>
</body>
</html>
