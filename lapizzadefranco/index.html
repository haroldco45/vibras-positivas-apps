<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Pizza de Franco - Buscador Real PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --rojo: #ce2b37; --verde: #008c45; --blanco: #ffffff; --beige: #fdfaf5; --oscuro: #1a1a1a; --exito: #25D366; --oro: #b38e44; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--beige); margin: 0; padding: 10px; padding-bottom: 220px; }
        
        header { background: var(--rojo); color: white; padding: 20px; text-align: center; border-radius: 0 0 30px 30px; margin: -10px -10px 15px -10px; border-bottom: 5px solid var(--verde); }
        .logo-pizza { width: 90px; border-radius: 15px; border: 2px solid white; background: white; margin-bottom: 8px; }

        .card { background: white; padding: 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .section-title { font-size: 13px; font-weight: bold; color: var(--rojo); text-transform: uppercase; margin-bottom: 12px; border-left: 5px solid var(--verde); padding-left: 10px; }

        input, textarea, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 15px; outline: none; }
        
        /* BUSCADOR PDF REAL */
        .search-box { position: relative; }
        #busqueda-prod { border: 2.5px solid var(--rojo); font-weight: bold; background: #fff; }
        
        .sugerencias { background: white; border: 1px solid #ddd; border-radius: 12px; position: absolute; width: 100%; z-index: 1000; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-top: -5px; }
        .sugerencia-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .sugerencia-item b { color: var(--rojo); display: block; text-transform: uppercase; font-size: 14px; }
        .sugerencia-item span { color: #555; font-size: 11px; display: block; }

        .item-agregado { background: #fdfaf5; padding: 15px; border-radius: 18px; border: 2px solid var(--oro); margin-top: 15px; }
        .footer-pedido { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 -8px 25px rgba(0,0,0,0.1); border-radius: 30px 30px 0 0; z-index: 1000; }
        .btn-enviar { background: var(--exito); color: white; border: none; padding: 18px; border-radius: 18px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-content">
    <header>
        <img src="lapizzadefranco.PNG" alt="Logo" class="logo-pizza">
        <h1 style="margin:0; font-size: 22px;">LA PIZZA DE FRANCO</h1>
        <div style="font-size: 11px; letter-spacing: 2px;">LECTOR DE CATÁLOGO PDF</div>
    </header>

    <div style="padding: 10px;">
        <div class="card">
            <div class="section-title">👤 Datos de Entrega</div>
            <input type="text" id="nom" placeholder="Tu nombre">
            <input type="text" id="dir" placeholder="Dirección">
            <input type="tel" id="tel_cli" placeholder="Celular">
            <select id="pago">
                <option value="Efectivo">Efectivo</option>
                <option value="Nequi">Nequi</option>
            </select>
        </div>

        <div class="card">
            <div class="section-title">🔍 BUSCAR EN EL PDF (Cualquier palabra)</div>
            <div class="search-box">
                <input type="text" id="busqueda-prod" placeholder="Ej: SABORES, BURRATA, POLLO..." onkeyup="buscarEnPDF(this.value)">
                <div id="box-sugerencias" class="sugerencias"></div>
            </div>

            <div id="area-seleccion" style="display:none;">
                <div class="item-agregado">
                    <div id="sel-nombre" style="font-weight:900; color:var(--oscuro); text-transform: uppercase;"></div>
                    <input type="text" id="prod-manual" placeholder="Escribe exactamente qué vas a pedir">
                    <input type="number" id="cant" value="1" min="1" onchange="recalcular()">
                    <input type="number" id="precio-u" placeholder="Precio unitario $" onkeyup="recalcular()">
                </div>
            </div>
        </div>
    </div>

    <div class="footer-pedido">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:900; font-size: 20px;">
            <span>TOTAL:</span><span id="total-vista" style="color: var(--verde);">$ 0</span>
        </div>
        <button class="btn-enviar" onclick="enviar()">🚀 ENVIAR PEDIDO</button>
    </div>
</div>

<script>
    const PDF_URL = 'pizzafranco.pdf'; 
    let textoCompletoPDF = "";

    // 1. CARGAR Y "EXTRAER" TODO EL TEXTO DEL PDF AL ABRIR LA APP
    async function cargarPDF() {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        const pdf = await loadingTask.promise;
        let fullText = "";
        
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(s => s.str).join(" ") + "\n";
        }
        textoCompletoPDF = fullText;
        console.log("PDF Cargado y leído");
    }
    cargarPDF();

    // 2. BUSCADOR QUE MIRA DENTRO DEL TEXTO EXTRAÍDO
    function buscarEnPDF(val) {
        const box = document.getElementById('box-sugerencias');
        if (val.length < 2) { box.style.display = 'none'; return; }

        // Dividimos el texto del PDF por líneas para simular productos
        const lineas = textoCompletoPDF.split("\n");
        const coincidencias = lineas.filter(l => l.toLowerCase().includes(val.toLowerCase())).slice(0, 10);

        if (coincidencias.length > 0) {
            box.innerHTML = coincidencias.map(l => `
                <div class="sugerencia-item" onclick="seleccionar('${l.trim()}')">
                    <b>Resultado encontrado:</b>
                    <span>${l.trim()}</span>
                </div>
            `).join('');
            box.style.display = 'block';
        } else {
            box.innerHTML = '<div style="padding:10px; color:red;">No se encontró "' + val + '" en el catálogo PDF</div>';
            box.style.display = 'block';
        }
    }

    function seleccionar(texto) {
        document.getElementById('area-seleccion').style.display = 'block';
        document.getElementById('sel-nombre').innerText = "Encontrado en PDF:";
        document.getElementById('prod-manual').value = texto;
        document.getElementById('box-sugerencias').style.display = 'none';
        document.getElementById('busqueda-prod').value = texto;
    }

    function recalcular() {
        const c = document.getElementById('cant').value;
        const p = document.getElementById('precio-u').value;
        document.getElementById('total-vista').innerText = `$ ${(c * p).toLocaleString()}`;
    }

    function enviar() {
        const n = document.getElementById('nom').value, d = document.getElementById('dir').value, 
              prod = document.getElementById('prod-manual').value, c = document.getElementById('cant').value,
              p = document.getElementById('precio-u').value;

        if(!n || !prod || !p) return alert("Completa los datos y el precio.");

        let msj = `*🍕 LA PIZZA DE FRANCO*\n👤 ${n}\n🏠 ${d}\n------------------\n• ${c}x ${prod}\n💰 TOTAL: $${(c*p).toLocaleString()}\n------------------\n_Vibras Positivas_`;
        window.open(`https://wa.me/573242233812?text=${encodeURIComponent(msj)}`);
    }
</script>
</body>
</html>
