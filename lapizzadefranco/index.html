<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Pizza de Franco - Pedido Rápido</title>
    <style>
        :root { --rojo: #ce2b37; --verde: #008c45; --blanco: #ffffff; --beige: #fdfaf5; --oscuro: #1a1a1a; --exito: #25D366; --oro: #b38e44; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--beige); margin: 0; padding: 10px; padding-bottom: 180px; }
        
        #bloqueo { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; z-index: 9999; text-align: center; padding-top: 100px; }
        
        header { background: var(--rojo); color: white; padding: 20px; text-align: center; border-radius: 0 0 30px 30px; margin: -10px -10px 15px -10px; border-bottom: 5px solid var(--verde); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-pizza { width: 100px; border-radius: 15px; border: 3px solid white; background: white; margin-bottom: 10px; }

        /* BOTÓN CATÁLOGO PDF */
        .btn-pdf { display: block; background: var(--oro); color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 15px; font-weight: bold; margin-bottom: 20px; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .card { background: white; padding: 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .section-title { font-size: 14px; font-weight: bold; color: var(--rojo); text-transform: uppercase; margin-bottom: 15px; border-left: 5px solid var(--verde); padding-left: 10px; }

        input, textarea, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        
        .btn-gps { background: #eef2ff; color: #3730a3; border: 1px dashed #3730a3; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; font-size: 12px; font-weight: bold; margin-bottom: 10px; }

        /* INTERACTIVIDAD DE PRODUCTOS */
        .item-pedido { background: #f9f9f9; padding: 15px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 10px; position: relative; }
        .sugerencias { background: white; border: 1px solid #ddd; border-radius: 0 0 12px 12px; position: absolute; width: 90%; z-index: 100; max-height: 150px; overflow-y: auto; display: none; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .sugerencia-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .sugerencia-item:hover { background: #fdfaf5; }

        .controles-cant { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .btn-c { background: var(--oscuro); color: white; border: none; width: 35px; height: 35px; border-radius: 10px; font-weight: bold; font-size: 20px; }
        .cant-n { font-weight: bold; color: var(--rojo); font-size: 20px; }

        .footer-pedido { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); border-radius: 25px 25px 0 0; z-index: 1000; }
        .btn-enviar { background: var(--exito); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<div id="bloqueo"><h1>🔒</h1><h2>SERVICIO SUSPENDIDO</h2><p>Contacte a VIBRAS POSITIVAS</p></div>

<div id="app-content">
    <header>
        <img src="lapizzadefranco.PNG" alt="Logo" class="logo-pizza">
        <h1 style="margin:0; font-size: 20px;">LA PIZZA DE FRANCO</h1>
        <div style="font-size: 12px; opacity: 0.9;">Caucasia - Pedidos Express</div>
    </header>

    <div class="container">
        <a href="pizzafranco.pdf" target="_blank" class="btn-pdf">📖 VER CARTA EN PDF (CLIC AQUÍ)</a>

        <div class="card">
            <div class="section-title">📍 Datos para el envío</div>
            <input type="text" id="nom" placeholder="👤 Tu nombre completo">
            <input type="text" id="dir" placeholder="🏠 Dirección exacta">
            <button class="btn-gps" onclick="obtenerGPS()" id="btn-gps-txt">📍 TOCAR AQUÍ PARA ENVIAR TU UBICACIÓN GPS</button>
            <input type="tel" id="tel_cli" placeholder="📞 Número de Celular">
            <select id="pago">
                <option value="Efectivo">Efectivo</option>
                <option value="Nequi">Nequi</option>
                <option value="Bancolombia">Bancolombia</option>
            </select>
            <textarea id="obs" rows="2" placeholder="📝 Notas (ej: sin cebolla, apto 4, etc...)"></textarea>
        </div>

        <div class="card">
            <div class="section-title">🍕 ¿Qué vas a pedir hoy?</div>
            <div id="lista-productos">
                <div class="item-pedido">
                    <input type="text" id="busqueda-prod" placeholder="Escribe tu pizza o lasagña..." onkeyup="filtrarProductos(this.value)">
                    <div id="box-sugerencias" class="sugerencias"></div>
                    
                    <div id="detalle-seleccion" style="display:none; margin-top:10px;">
                        <div id="prod-nombre" style="font-weight:bold; color:var(--oscuro);"></div>
                        <select id="prod-tamano" onchange="actualizarPrecioSeleccionado()" style="margin-top:5px;"></select>
                        
                        <div class="controles-cant">
                            <button class="btn-c" onclick="ajustarCant(-1)">-</button>
                            <span id="cant-actual" class="cant-n">1</span>
                            <button class="btn-c" onclick="ajustarCant(1)">+</button>
                            <span id="precio-subtotal" style="margin-left:auto; font-weight:bold; color:var(--verde);"></span>
                        </div>
                    </div>
                </div>
            </div>
            <p style="font-size: 11px; color: #888; text-align: center;">Busca el producto de la carta y el sistema te dará el precio.</p>
        </div>
    </div>

    <div class="footer-pedido">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:bold; font-size: 18px;">
            <span>TOTAL A PAGAR:</span><span id="total-vista" style="color: var(--verde);">$ 0</span>
        </div>
        <button class="btn-enviar" onclick="enviar()">🚀 ENVIAR PEDIDO POR WHATSAPP</button>
    </div>
</div>

<script>
    const WA_FRANCO = "573242233812";
    let gps_link = "";
    let productoSeleccionado = null;
    let cantidadActual = 1;

    // Base de datos integrada de tu carta
    const carta = [
        { n: "Especial de la Casa Pro", p: { Personal: 40000, Mediana: 78000, Familiar: 154000 } },
        { n: "Jamón Serrano Pro", p: { Personal: 44000, Mediana: 80000, Familiar: 154000 } },
        { n: "Carbonara de la Casa", p: { Personal: 30000, Mediana: 40000, Familiar: 72000 } },
        { n: "Llanera", p: { Personal: 36000, Mediana: 56000, Familiar: 84000 } },
        { n: "Paisa", p: { Personal: 36000, Mediana: 46000, Familiar: 88000 } },
        { n: "Hawaiana", p: { Personal: 27000, Mediana: 37000, Familiar: 78000 } },
        { n: "Pepperoni", p: { Personal: 34000, Mediana: 46000, Familiar: 82000 } },
        { n: "Carnes", p: { Personal: 32000, Mediana: 42000, Familiar: 77000 } },
        { n: "Pollo y Champiñón", p: { Personal: 32000, Mediana: 42000, Familiar: 77000 } },
        { n: "Lasagña Pollo Pro", p: { Pequeña: 32000, Grande: 42000 } },
        { n: "Lasagña Mixta", p: { Pequeña: 34000, Grande: 38000 } },
        { n: "Lasagña Boloñesa", p: { Pequeña: 32000, Grande: 36000 } },
        { n: "Gaseosa 1.5 L", p: { Unica: 8000 } },
        { n: "Gaseosa Personal", p: { Unica: 3500 } }
    ];

    function filtrarProductos(val) {
        const box = document.getElementById('box-sugerencias');
        if (val.length < 2) { box.style.display = 'none'; return; }
        
        const sugerencias = carta.filter(p => p.n.toLowerCase().includes(val.toLowerCase()));
        if (sugerencias.length > 0) {
            box.innerHTML = sugerencias.map(p => `<div class="sugerencia-item" onclick='seleccionar("${p.n}")'>${p.n}</div>`).join('');
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
    }

    function seleccionar(nombre) {
        productoSeleccionado = carta.find(p => p.n === nombre);
        document.getElementById('box-sugerencias').style.display = 'none';
        document.getElementById('busqueda-prod').value = nombre;
        
        // Configurar Tamaños
        const selectTam = document.getElementById('prod-tamano');
        selectTam.innerHTML = "";
        for (let t in productoSeleccionado.p) {
            selectTam.innerHTML += `<option value="${t}">${t} - $${productoSeleccionado.p[t].toLocaleString()}</option>`;
        }
        
        document.getElementById('prod-nombre').innerText = nombre;
        document.getElementById('detalle-seleccion').style.display = 'block';
        cantidadActual = 1;
        document.getElementById('cant-actual').innerText = cantidadActual;
        actualizarPrecioSeleccionado();
    }

    function ajustarCant(v) {
        cantidadActual = Math.max(1, cantidadActual + v);
        document.getElementById('cant-actual').innerText = cantidadActual;
        actualizarPrecioSeleccionado();
    }

    function actualizarPrecioSeleccionado() {
        if (!productoSeleccionado) return;
        const tam = document.getElementById('prod-tamano').value;
        const precioUnitario = productoSeleccionado.p[tam];
        const subtotal = precioUnitario * cantidadActual;
        document.getElementById('precio-subtotal').innerText = `$ ${subtotal.toLocaleString()}`;
        document.getElementById('total-vista').innerText = `$ ${subtotal.toLocaleString()}`;
    }

    function obtenerGPS() {
        if (navigator.geolocation) {
            document.getElementById('btn-gps-txt').innerText = "⏳ LOCALIZANDO...";
            navigator.geolocation.getCurrentPosition((p) => {
                gps_link = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                document.getElementById('btn-gps-txt').innerText = "✅ UBICACIÓN REGISTRADA";
                document.getElementById('btn-gps-txt').style.background = "#dcfce7";
            }, () => alert("Socio, activa el GPS."));
        }
    }

    function enviar() {
        const n = document.getElementById('nom').value, 
              d = document.getElementById('dir').value, 
              c = document.getElementById('tel_cli').value, 
              p = document.getElementById('pago').value, 
              o = document.getElementById('obs').value;

        if (!n || !d || !productoSeleccionado) return alert("Completa tus datos y selecciona un producto.");

        const tam = document.getElementById('prod-tamano').value;
        const total = productoSeleccionado.p[tam] * cantidadActual;

        let msj = `*🍕 LA PIZZA DE FRANCO*\n`;
        msj += `👤 *CLIENTE:* ${n}\n`;
        msj += `🏠 *DIR:* ${d}\n`;
        if(gps_link) msj += `📍 *GPS:* ${gps_link}\n`;
        msj += `📞 *TEL:* ${c}\n`;
        msj += `💳 *PAGO:* ${p}\n`;
        msj += `--------------------------\n`;
        msj += `• ${cantidadActual}x ${productoSeleccionado.n}\n`;
        msj += `  Tamaño: ${tam}\n`;
        if(o) msj += `📝 *NOTA:* ${o}\n`;
        msj += `--------------------------\n`;
        msj += `💰 *TOTAL: $${total.toLocaleString()}*\n\n`;
        msj += `_Enviado desde la App Vibras Positivas_`;

        window.open(`https://wa.me/${WA_FRANCO}?text=${encodeURIComponent(msj)}`);
    }

    // Sistema de bloqueo de seguridad
    async function check() {
        try {
            const r = await fetch('https://haroldco45.github.io/control-vibras.js');
            const t = await r.text();
            if(t.includes('"la-pizza-de-franco": "suspendido"')) {
                document.getElementById('bloqueo').style.display='block';
                document.getElementById('app-content').style.display='none';
            }
        } catch(e){}
    }
    check();
</script>
</body>
</html>
