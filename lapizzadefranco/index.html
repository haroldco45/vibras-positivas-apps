<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Pizza de Franco - Buscador Total 100%</title>
    <style>
        :root { --rojo: #ce2b37; --verde: #008c45; --blanco: #ffffff; --beige: #fdfaf5; --oscuro: #1a1a1a; --exito: #25D366; --oro: #b38e44; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--beige); margin: 0; padding: 10px; padding-bottom: 220px; }
        header { background: var(--rojo); color: white; padding: 20px; text-align: center; border-radius: 0 0 30px 30px; margin: -10px -10px 15px -10px; border-bottom: 5px solid var(--verde); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-pizza { width: 85px; border-radius: 15px; border: 2px solid white; background: white; margin-bottom: 8px; }
        .btn-pdf { display: block; background: var(--oro); color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; border: 2px solid white; font-size: 14px; }
        .card { background: white; padding: 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #eee; }
        .section-title { font-size: 12px; font-weight: bold; color: var(--rojo); text-transform: uppercase; margin-bottom: 12px; border-left: 5px solid var(--verde); padding-left: 10px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 15px; outline: none; }
        .search-box { position: relative; }
        #busqueda-prod { border: 2.5px solid var(--rojo); font-weight: bold; background: #fff; }
        .sugerencias { background: white; border: 1px solid #ddd; border-radius: 10px; position: absolute; width: 100%; z-index: 1000; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .sugerencia-item { padding: 14px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; }
        .sugerencia-item b { color: var(--rojo); display: block; font-size: 14px; text-transform: uppercase; }
        .sugerencia-item span { font-size: 11px; color: #555; line-height: 1.2; }
        .btn-gps { background: #f0f7f4; color: var(--verde); border: 1px dashed var(--verde); padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; font-size: 12px; font-weight: bold; margin: 5px 0; }
        .footer-pedido { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 -8px 25px rgba(0,0,0,0.1); border-radius: 25px 25px 0 0; z-index: 1000; }
        .btn-enviar { background: var(--exito); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
        .item-agregado { background: #fdfaf5; padding: 15px; border-radius: 15px; border: 2px solid var(--oro); margin-top: 10px; }
        .cant-n { font-weight: 900; color: var(--rojo); font-size: 22px; margin: 0 15px; }
    </style>
</head>
<body>

<header>
    <img src="lapizzadefranco.PNG" alt="Logo" class="logo-pizza">
    <h1 style="margin:0; font-size: 20px;">LA PIZZA DE FRANCO</h1>
    <p style="margin:0; font-size: 11px;">BUSCADOR TOTAL DE PRODUCTOS</p>
</header>

<div style="padding: 10px;">
    <a href="pizzafranco.pdf" target="_blank" class="btn-pdf">📖 VER CARTA ORIGINAL (PDF)</a>

    <div class="card">
        <div class="section-title">📍 Datos de Entrega</div>
        <input type="text" id="nom" placeholder="👤 Nombre y Apellido">
        <input type="text" id="dir" placeholder="🏠 Dirección y Barrio">
        <button class="btn-gps" onclick="obtenerGPS()" id="btn-gps-txt">📍 CAPTURAR MI UBICACIÓN GPS</button>
        <input type="tel" id="tel_cli" placeholder="📞 Número de Celular">
        <select id="pago">
            <option value="Efectivo">Efectivo</option>
            <option value="Nequi">Nequi</option>
            <option value="Bancolombia">Bancolombia</option>
            <option value="Datafono">Datáfono</option>
        </select>
    </div>

    <div class="card">
        <div class="section-title">🍕 Buscar Producto o Ingrediente</div>
        <div class="search-box">
            <input type="text" id="busqueda-prod" placeholder="Escribe: sabores, burrata, pollo, lasaña..." onkeyup="ojoExtractor(this.value)">
            <div id="box-sugerencias" class="sugerencias"></div>
        </div>

        <div id="area-seleccion" style="display:none;">
            <div class="item-agregado">
                <div id="sel-nombre" style="font-weight:900; text-transform: uppercase; font-size: 16px;"></div>
                <div id="sel-desc" style="font-size: 11px; color: #666; margin-bottom: 12px; font-style: italic;"></div>
                
                <label style="font-size: 11px; font-weight: bold; color: var(--rojo);">TAMAÑO / PORCIÓN DISPONIBLE:</label>
                <select id="sel-tamano" onchange="recalcular()"></select>
                
                <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                    <div style="display:flex; align-items: center;">
                        <button onclick="cambiarCant(-1)" style="width:35px; height:35px; border-radius: 8px; border:none; background: var(--oscuro); color:white;">-</button>
                        <span id="sel-cant" class="cant-n">1</span>
                        <button onclick="cambiarCant(1)" style="width:35px; height:35px; border-radius: 8px; border:none; background: var(--oscuro); color:white;">+</button>
                    </div>
                    <div id="sel-subtotal" style="font-weight:900; color:var(--verde); font-size: 19px;">$ 0</div>
                </div>
            </div>
            <textarea id="obs" rows="2" placeholder="📝 Notas especiales (Sin cebolla, etc.)" style="margin-top:10px;"></textarea>
        </div>
    </div>
</div>

<div class="footer-pedido">
    <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:900; font-size: 20px;">
        <span>TOTAL:</span><span id="total-vista" style="color: var(--verde);">$ 0</span>
    </div>
    <button class="btn-enviar" onclick="enviarWhatsApp()">🚀 ENVIAR PEDIDO A WHATSAPP</button>
</div>

<script>
    const WA_NUMBER = "573242233812";
    let gps_link = "";
    let itemActivo = null;
    let cantidad = 1;

    // BASE DE DATOS CORREGIDA (Sin errores de sintaxis)
    const carta = [
        { n: "2 SABORES ESPECIAL", d: "jamon serrano, esp.casa, llanera, mariscos, mar y tierra, esp. napolitana, capresa, especial jamon serrano", p: { Personal: 42000, Mediano: 62000, Familiar: 132000 } },
        { n: "PIZZA ESP.CASA.JAMON SERRANO", d: "Burrata, serrano, cherry", p: { Personal: 44000, Mediano: 78000, Familiar: 152000 } },
        { n: "2 SABORES TRADICIONAL", d: "Combina dos sabores clásicos", p: { Personal: 37000, Mediano: 47000, Familiar: 89000 } },
        { n: "JAMON QUESO HAWAIANA", d: "Mezcla tradicional", p: { Personal: 36000, Mediano: 47000, Familiar: 77000 } },
        { n: "JAMON Y QUESO", d: "Base pizza, napolitana, queso mozzarella, jamon", p: { Personal: 25000, Mediano: 35000, Familiar: 88000 } },
        { n: "NAPOLITANA", d: "Base pizza, queso mozzarella, albahaca", p: { Personal: 22000, Mediano: 32000, Familiar: 62000 } },
        { n: "HAWAIANA", d: "Base pizza, salsa napolitana, queso mozzarella, jamon, piña", p: { Personal: 27000, Mediano: 37000, Familiar: 78000 } },
        { n: "MARGARITA", d: "Tomate cherry, albahaca, aceite de oliva", p: { Personal: 28000, Mediano: 38000, Familiar: 75000 } },
        { n: "LA CASA", d: "Salsa de la casa, jamon, tocineta, aceitunas, maiz, chorizo", p: { Personal: 34000, Mediano: 44000, Familiar: 80000 } },
        { n: "CARBONARA DE LA CASA", d: "Tocineta, jamon, frutos secos, miel", p: { Personal: 30000, Mediano: 40000, Familiar: 72000 } },
        { n: "BOLOGÑESA", d: "Carne bologñesa, tocineta, jamon", p: { Personal: 32000, Mediano: 42000, Familiar: 77000 } },
        { n: "RANCHERA", d: "Salchicha ranchera, pimenton, cebolla morada", p: { Personal: 32000, Mediano: 42000, Familiar: 77000 } },
        { n: "ESPECIAL RANCHERA", d: "Ranchera, pepperoni, oregano, pimienta", p: { Personal: 38000, Mediano: 48000, Familiar: 82000 } },
        { n: "JAMON SERRANO Y CHAMPIÑON", d: "Jamon serrano, champiñon, cherry", p: { Personal: 34000, Mediano: 44000, Familiar: 77000 } },
        { n: "PEPPERONI", d: "Doble pepperoni, mozzarella", p: { Personal: 34000, Mediano: 46000, Familiar: 82000 } },
        { n: "POLLO Y CHAMPIGÑON", d: "Pollo, champigñon, mozzarella", p: { Personal: 32000, Mediano: 42000, Familiar: 77000 } },
        { n: "VERDURAS", d: "Maiz, cherry, pimenton, aceitunas", p: { Personal: 32000, Mediano: 42000, Familiar: 77000 } },
        { n: "CAPRESA", d: "Tomate chonto, burrata, oregano", p: { Personal: 38000, Mediano: 74000, Familiar: 147000 } },
        { n: "LLANERA", d: "Res y cerdo llanero, queso llanero, chimichurri", p: { Personal: 36000, Mediano: 56000, Familiar: 84000 } },
        { n: "MAR Y TIERRA", d: "Mariscos y pollo", p: { Personal: 34000, Mediano: 54000, Familiar: 82000 } },
        { n: "PAISA", d: "Chicharron, maduro, carne molida, aguacate", p: { Personal: 36000, Mediano: 46000, Familiar: 88000 } },
        { n: "MARISCOS", d: "Mix de mariscos, pimenton", p: { Personal: 37000, Mediano: 57000, Familiar: 98000 } },
        { n: "ESPECIAL DE LA CASA", d: "Pollo, tocineta, cherry, burrata, pesto", p: { Personal: 40000, Mediano: 78000, Familiar: 154000 } },
        { n: "ESPECIAL DE POLLO", d: "Jamon, tocineta, frutos secos, pollo", p: { Personal: 32000, Mediano: 42000, Familiar: 77000 } },
        { n: "VEGETALES CON POLLO", d: "Berenjena, pimenton, champiñon, maiz, pollo", p: { Personal: 34000, Mediano: 44000, Familiar: 80000 } },
        { n: "ESPECIAL PEPPERONI", d: "Pepperoni, champiñon, pimenton, cebolla roja", p: { Personal: 38000, Mediano: 74000, Familiar: 147000 } },
        { n: "PIÑA Y POLLO", d: "Jamon, tocineta, piña, pollo", p: { Personal: 35000, Mediano: 45000, Familiar: 80000 } },
        { n: "ESPECIAL JAMON SERRANO", d: "Serrano, champiñon, parmesano, burrata", p: { Personal: 44000, Mediano: 80000, Familiar: 154000 } },
        { n: "LASAGÑA PERSONAL POLLO", d: "Pasta, pollo, jamon, bechamel", p: { Pequeña: 32000, Grande: 36000 } },
        { n: "LASAGÑA PERSONAL BOLOGÑESA", d: "Carne molida, napolitana", p: { Pequeña: 32000, Grande: 36000 } },
        { n: "LASAGÑA MIXTA", d: "Pollo y carne res", p: { Pequeña: 32000, Grande: 36000 } }
    ];

    function ojoExtractor(val) {
        const box = document.getElementById('box-sugerencias');
        if (val.length < 1) { box.style.display = 'none'; return; }
        
        const terminos = val.toLowerCase().split(" ");
        const res = carta.filter(p => {
            const contenido = (p.n + " " + p.d).toLowerCase();
            return terminos.every(t => contenido.includes(t));
        });

        if (res.length > 0) {
            box.innerHTML = res.map(p => `
                <div class="sugerencia-item" onclick='seleccionar("${p.n}")'>
                    <b>${p.n}</b>
                    <span>${p.d}</span>
                </div>
            `).join('');
            box.style.display = 'block';
        } else {
            box.innerHTML = '<div style="padding:15px; color:red;">No hay coincidencias...</div>';
            box.style.display = 'block';
        }
    }

    function seleccionar(nombre) {
        itemActivo = carta.find(p => p.n === nombre);
        document.getElementById('box-sugerencias').style.display = 'none';
        document.getElementById('busqueda-prod').value = nombre;
        document.getElementById('sel-nombre').innerText = itemActivo.n;
        document.getElementById('sel-desc').innerText = itemActivo.d;
        
        const sel = document.getElementById('sel-tamano');
        sel.innerHTML = "";
        for (let t in itemActivo.p) {
            sel.innerHTML += `<option value="${t}">${t.toUpperCase()} ($${itemActivo.p[t].toLocaleString()})</option>`;
        }
        
        document.getElementById('area-seleccion').style.display = 'block';
        cantidad = 1;
        document.getElementById('sel-cant').innerText = cantidad;
        recalcular();
    }

    function cambiarCant(v) {
        cantidad = Math.max(1, cantidad + v);
        document.getElementById('sel-cant').innerText = cantidad;
        recalcular();
    }

    function recalcular() {
        if (!itemActivo) return;
        const tam = document.getElementById('sel-tamano').value;
        const sub = itemActivo.p[tam] * cantidad;
        document.getElementById('sel-subtotal').innerText = `$ ${sub.toLocaleString()}`;
        document.getElementById('total-vista').innerText = `$ ${sub.toLocaleString()}`;
    }

    function obtenerGPS() {
        if (navigator.geolocation) {
            document.getElementById('btn-gps-txt').innerText = "⏳ LOCALIZANDO...";
            navigator.geolocation.getCurrentPosition((p) => {
                gps_link = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                document.getElementById('btn-gps-txt').innerText = "✅ UBICACIÓN LISTA";
                document.getElementById('btn-gps-txt').style.background = "#dcfce7";
            }, () => alert("Socio, activa el GPS."));
        }
    }

    function enviarWhatsApp() {
        const n = document.getElementById('nom').value, d = document.getElementById('dir').value,
              c = document.getElementById('tel_cli').value, p = document.getElementById('pago').value,
              o = document.getElementById('obs').value;

        if (!n || !d || !itemActivo) return alert("Llena tus datos y selecciona un producto.");

        const tam = document.getElementById('sel-tamano').value;
        const total = itemActivo.p[tam] * cantidad;

        let msj = `*🍕 LA PIZZA DE FRANCO*\n`;
        msj += `👤 *CLIENTE:* ${n}\n🏠 *DIR:* ${d}\n`;
        if(gps_link) msj += `📍 *GPS:* ${gps_link}\n`;
        msj += `📞 *TEL:* ${c}\n💳 *PAGO:* ${p}\n`;
        msj += `--------------------------\n*DETALLE DEL PEDIDO:*\n`;
        msj += `• ${itemActivo.n}\n  Porción: ${tam.toUpperCase()}\n  Cant: ${cantidad} x $${itemActivo.p[tam].toLocaleString()}\n`;
        if(o) msj += `📝 *NOTAS:* ${o}\n`;
        msj += `--------------------------\n💰 *TOTAL A COBRAR: $${total.toLocaleString()}*\n\n_Vibras Positivas_`;

        window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msj)}`);
    }
</script>
</body>
</html>
